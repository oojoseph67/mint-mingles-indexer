manifestVersion: subsquid.io/v0.1

name: mint-mingles-indexer

# version: 1.0

description: Indexer for Mint Mingles NFT Marketplace on CrossFi (Testnet)

slot: v1

build:

deploy:
  addons:
    postgres:
      config:
        statement_timeout: 100000
        log_min_duration_statement: 100000
    # rpc:
    #   - eth.http
  processor:
    cmd:
      - sqd
      - process:prod
  api:
    cmd:
      - sqd
      - serve:prod
scale:
  dedicated: true
  addons:
    postgres:
      storage: 1G
      profile: medium
  api:
    profile: medium
    replicas: 1
